# Publishes the latest release's eyecansee-flatpak-repo.tar (signed on the developer's PC by
# tools/sign-flatpak.sh of IoSonoPiero/eyecansee): repo/ (OSTree) and media/ (icons and screenshots
# AppStream points to), with site/ at the root.
name: pages
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Repository of the latest release, checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=eyecansee-flatpak-repo.tar
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "$F"
          WANT=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -oP "^SHA-256 of \Q$F\E: \`\K[0-9a-f]{64}")
          echo "$WANT  $F" | sha256sum -c
          cp -r site _site && tar -C _site -xf "$F"  # repo/ and media/
          du -sh _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
