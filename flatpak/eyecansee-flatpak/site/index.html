<h1>EyeCanSee Flatpak</h1>
<p>The Flatpak repository of <a href="https://github.com/IoSonoPiero/eyecansee">EyeCanSee</a>, an image and video viewer and manager.</p>
<p><a href="eyecansee.flatpakref">Install EyeCanSee</a> (opens in your software center), or in a terminal:</p>
<pre>flatpak install https://flatpak.montinaro.info/eyecansee.flatpakref</pre>
<p>Updates come with <code>flatpak update</code> or your software center.</p>
