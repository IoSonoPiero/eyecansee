[package]
name = "eyecansee"
version = "0.76.0"
edition = "2024"
description = "A viewer, manager and editor for photos, videos, 3D models and CAD drawings, for Linux and Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/IoSonoPiero/eyecansee"

# HEIC/AVIF (libheif) and the ImageMagick fallback are C libraries: `cargo build --no-default-features`
# builds without them, and those formats do not appear in the list. On Windows libheif comes from vcpkg
# (see README) and is built with `--no-default-features --features heif`; ImageMagick is not set up yet.
[features]
default = ["heif", "magick"]
heif = ["dep:libheif-rs"]
magick = ["dep:magick_rust"]

[dependencies]
bytes = "1.12.1"
eframe = "0.37.0"
# 🗀 and 🖴 icons from the bundled fonts: without it egui looks for them in system fonts (Windows lacks them).
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26.0"
fluent-bundle = "0.16.0"
# Stream of chunks for uploads to phones (copy and move).
futures-util = "0.3.34"
# File date in the status bar; already compiled for OpenDAL.
jiff = "0.2.38"
image = "0.25.10"
# Components downloaded when needed (component.rs) come gzip-compressed; already compiled for image.
flate2 = "1.1.10"
# libmpv for videos, opened at run time (mpv.rs): not needed to build or to start.
libloading = "0.8.9"
# IPTC digest of a TIFF (meta_write::tiff_iptc); already compiled for rawler and russh.
md5 = "0.8.1"
jxl-oxide = { version = "0.12.6", features = ["image"] }
libheif-rs = { version = "3.0.0", optional = true }
magick_rust = { version = "2.1.1", optional = true }
mtp-rs = "0.37.3"
opendal = { version = "0.59.5", default-features = false, features = ["services-fs"] }
percent-encoding = "2.3.2"
rawler = "0.8.0"
resvg = "0.48.1"
# SFTP servers on Linux and Windows (sftp.rs): one SSH connection per server, keys from the agent or
# ~/.ssh, ~/.ssh/config and known_hosts read as ssh does. On ring, already built for the updates.
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "0.58.0"
russh-sftp = "3.0.1"
# Saved servers: the key file chosen in the system window (XDG portal on Linux, on zbus already built
# for accessibility; the common dialog on Windows).
rfd = "0.17.2"
# FTP servers (ftp.rs): passive mode to the server's own address, several connections, rename;
# already built for OpenDAL.
suppaftp = { version = "10.0.2", features = ["tokio-rustls-ring"] }
# FTPS (ftp/tls.rs): certificates checked against the usual authorities or trusted by the user;
# the versions suppaftp and ureq already build.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.11"
# Master password of the saved servers (servers/vault.rs): Argon2id turns it into the key (the
# encryption is ring's ChaCha20-Poly1305); zxcvbn rates how strong a new one is.
argon2 = "0.5.3"
zxcvbn = "3.1.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }
unic-langid = "0.9.6"
url = "2.5.8"
kamadak-exif = "0.6.1"
interprocess = "2.4.6"
# Deleting local images: system trash (freedesktop on Linux, Recycle Bin on Windows).
trash = "5.2.9"
# Local folders updated by themselves when files change (inotify, ReadDirectoryChangesW).
notify = "8.2.0"
image-extras = "0.1.1"
psd = "0.3.5"
hayro-jpeg2000 = "0.4.1"
# Updates from the GitHub releases: download over HTTPS (on rustls, already built for FTPS) and SHA-256 check.
ureq = { version = "3", default-features = false, features = ["rustls"] }
ring = "0.17.14"
# Updates install only files signed with the project's minisign key (Ed25519), so that whoever can upload
# release assets cannot ship an update. Pure Rust, no dependencies.
minisign-verify = "0.3.0"
# Save in another format: all the options of each encoder. libjpeg-turbo, ravif and tiff are already built
# (for decoding and inside `image`); libwebp adds lossy WebP, which `image` cannot write.
ravif = "0.13.0"
tiff = "0.11.3"
webp = { version = "0.3", default-features = false }
stl_io = "0.11.0"
tobj = "4.0.5"
ply-rs-bw = "4.0.1"
base64 = "0.23.1"
roxmltree = "0.21.1"
# XMP of a saved image made to fit it (xmp.rs): reads and writes keeping every byte it does not
# change; already built for OpenDAL.
quick-xml = "0.42.0"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "KHR_texture_transform", "KHR_materials_unlit", "KHR_materials_pbrSpecularGlossiness", "KHR_materials_emissive_strength", "KHR_materials_ior", "KHR_materials_specular", "KHR_materials_transmission", "KHR_materials_volume", "KHR_materials_variants", "KHR_lights_punctual"] }
# Smaller glTF: Draco geometry (pure Rust decoder, MIT/Apache-2.0, pre-release pinned) and
# meshopt (meshoptimizer, C++, MIT), decoded to plain glTF before reading (model_gltf_unpack.rs).
draco-oxide-decoder = "=0.1.0-alpha.12"
draco-oxide-core = "=0.1.0-alpha.12"
meshopt = "0.7.0"
# Code pages of CAD drawings, for the East Asian characters of SHX big fonts (cad_text.rs).
encoding_rs = "0.8.44"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }
rayon = "1.12.0"
acadrust = { version = "0.6.8", default-features = false }
ifc-lite-processing = "27.1.0"
# FBX models (model_fbx.rs): the ufbx C library (MIT or public domain), built with cc.
ufbx = "0.11.5"
# Texts of VRML and X3D models turned into triangles (model_text.rs); already built for ifc-lite.
earcutr = "0.5.0"

[target."cfg(windows)".dependencies]
# Drives (C:, D:, …): type, label and bus (USB/SD = external) for "This computer" and Devices.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".build-dependencies]
# Icon and version data inside eyecansee.exe (`build.rs`), with rc.exe from the Build Tools.
winresource = "0.1.34"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(target_os = \"linux\")".dependencies]
# The editor's eyedropper on the whole screen, through the desktop's portal (eyedropper.rs);
# already built for the accessibility of egui (accesskit), with the same features.
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

# Functions longer than the limit in clippy.toml fail the check (check.yml runs clippy with -D warnings).
[lints.clippy]
too_many_lines = "warn"

[profile.release]
strip = true

# Packages for download (GitHub Actions: Windows zip, AppImage): whole-program optimisation.
# Measured on Windows: 39.4 MB instead of 48.8, but ~20 min to build from scratch instead of ~5,
# because the final optimisation runs on a single core. Everyday builds stay on `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Trial builds by hand (`--profile prova`): as `release`, but only what changed is compiled again.
# The same code; only the exe is bigger. Never for packages.
[profile.prova]
inherits = "release"
incremental = true

# magick_rust 2.1.1 imports ResourceType only on Linux and macOS, so it does not build on Windows.
# avif-serialize 0.8.9 and ravif 0.13.0 write no colour profile and no XMP: the copies in vendor/ add
# them (`colr` of type `prof`, a `mime` item), proposed to their author (notes/avif-serialize-pr.md).
[patch.crates-io]
magick_rust = { path = "vendor/magick_rust" }
avif-serialize = { path = "vendor/avif-serialize" }
ravif = { path = "vendor/ravif" }
