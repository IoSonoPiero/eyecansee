[package]
name = "eyecansee"
version = "0.24.2"
edition = "2024"
description = "Image viewer for Linux and Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/IoSonoPiero/eyecansee"

# HEIC/AVIF (libheif) and the ImageMagick fallback are C libraries: `cargo build --no-default-features`
# builds without them, and those formats do not appear in the list. On Windows libheif comes from vcpkg
# (see README) and is built with `--no-default-features --features heif`; ImageMagick is not set up yet.
[features]
default = ["heif", "magick"]
heif = ["dep:libheif-rs"]
magick = ["dep:magick_rust"]

[dependencies]
bytes = "1.12.1"
eframe = "0.37.0"
# 🗀 and 🖴 icons from the bundled fonts: without it egui looks for them in system fonts (Windows lacks them).
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_commonmark = "0.26.0"
fluent-bundle = "0.16.0"
# Stream of chunks for uploads to phones (copy and move).
futures-util = "0.3.34"
# File date in the status bar; already compiled for OpenDAL.
jiff = "0.2.38"
image = "0.25.10"
jxl-oxide = { version = "0.12.6", features = ["image"] }
libheif-rs = { version = "3.0.0", optional = true }
magick_rust = { version = "2.1.1", optional = true }
mtp-rs = "0.34.0"
opendal = { version = "0.59.5", default-features = false, features = ["services-fs", "services-ftp"] }
percent-encoding = "2.3.2"
rawler = "0.8.0"
resvg = "0.48.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }
unic-langid = "0.9.6"
url = "2.5.8"
kamadak-exif = "0.6.1"
interprocess = "2.4.6"
# Deleting local images: system trash (freedesktop on Linux, Recycle Bin on Windows).
trash = "5.2.9"
# Local folders updated by themselves when files change (inotify, ReadDirectoryChangesW).
notify = "8.2.0"
image-extras = "0.1.1"
psd = "0.3.5"
hayro-jpeg2000 = "0.4.1"

[target."cfg(windows)".dependencies]
# Drives (C:, D:, …): type, label and bus (USB/SD = external) for "This computer" and Devices.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[target."cfg(windows)".build-dependencies]
# Icon and version data inside eyecansee.exe (`build.rs`), with rc.exe from the Build Tools.
winresource = "0.1.34"

[target."cfg(unix)".dependencies]
opendal = { version = "0.59.5", default-features = false, features = ["services-sftp"] }

[profile.release]
strip = true

# Packages for download (GitHub Actions: Windows zip, AppImage): whole-program optimisation.
# Measured on Windows: 39.4 MB instead of 48.8, but ~20 min to build from scratch instead of ~5,
# because the final optimisation runs on a single core. Everyday builds stay on `release`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
