# Builds a release when a tag v<version> is pushed: the Windows zip and installer, the Linux AppImage and the source
# RPM for COPR. The files go into a draft GitHub release, published by hand once checked.
# Tags with a suffix (v0.21.0-test) are trial runs: prerelease draft, and the RPM is not sent to COPR.
# On main (when this file, the Windows libraries action or the AppImage script change, or by hand) it only builds the zip and the
# AppImage: GitHub ties caches to the ref that made them, and tags can read only their own and main's.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [.github/workflows/release.yml, .github/actions/**, tools/build-appimage.sh]
  workflow_dispatch:

# Each job gets only what it needs: just the release job can write to the repository (the draft), and
# nothing here signs the files (tools/sign-release.sh does it on the developer's PC).
# Actions are pinned to a commit (the tag in a comment), here and in check.yml and .github/actions: a moved
# tag cannot change what builds the releases. New SHA: gh api repos/<owner>/<action>/commits/<tag> --jq .sha
# Runners by version (ubuntu-24.04), not ubuntu-latest: GitHub moves that label to a new Ubuntu by itself.
jobs:
  version:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      trial: ${{ steps.v.outputs.trial }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: v
        run: |
          VER=$(cat VERSION)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == *-* ]]; then
            echo "trial=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" != "v$VER" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($VER)"; exit 1
          else
            echo "trial=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    permissions:
      contents: read
    needs: version
    runs-on: windows-latest
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Rust, NASM, libheif and ImageMagick: the same as check.yml.
      - uses: ./.github/actions/windows-deps
      - name: Build
        run: cargo build --profile dist --locked --no-default-features --features heif,magick
      - name: Zip
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          .\tools\third-party-licenses.ps1 -Project . -Out pkg\THIRD-PARTY-LICENSES.txt
          # The C libraries built by vcpkg are linked into the executable: their licences and sources too.
          $sources = [ordered]@{ libheif = "https://github.com/strukturag/libheif"
                                 libde265 = "https://github.com/strukturag/libde265"
                                 dav1d = "https://code.videolan.org/videolan/dav1d" }
          foreach ($p in $sources.Keys) {
            $line = & "$env:VCPKG_ROOT\vcpkg.exe" list $p | Where-Object { $_ -match "^${p}:x64-windows-static\s" }
            $ver = ($line -split '\s+')[1]
            $bar = "=" * 78
            Add-Content pkg\THIRD-PARTY-LICENSES.txt "`n$bar`n$p $ver (linked into eyecansee.exe, built with vcpkg)`nSource: $($sources[$p])`n$bar`n"
            Get-Content -Raw "$env:VCPKG_ROOT\installed\x64-windows-static\share\$p\copyright" | Add-Content pkg\THIRD-PARTY-LICENSES.txt
          }
          # ImageMagick: NOTICE.txt holds its licence and those of the libraries it brings.
          $bar = "=" * 78
          Add-Content pkg\THIRD-PARTY-LICENSES.txt "`n$bar`nImageMagick $env:IM_VERSION (DLLs and modules\ next to eyecansee.exe, official Windows build)`nSource: https://github.com/ImageMagick/ImageMagick`n$bar`n"
          Get-Content -Raw "$env:IMAGE_MAGICK_DIR\NOTICE.txt" | Add-Content pkg\THIRD-PARTY-LICENSES.txt
          Copy-Item "$env:IMAGE_MAGICK_DIR\*.dll", "$env:IMAGE_MAGICK_DIR\*.xml", "$env:IMAGE_MAGICK_DIR\sRGB.icc" pkg\
          Copy-Item "$env:IMAGE_MAGICK_DIR\modules" pkg\ -Recurse
          Copy-Item target\dist\eyecansee.exe pkg\
          Copy-Item LICENSE pkg\LICENSE.txt
          Compress-Archive -Path pkg\* -DestinationPath "EyeCanSee-$env:VER-windows-x64.zip"
      - name: Startup test
        run: |
          Expand-Archive "EyeCanSee-$env:VER-windows-x64.zip" -DestinationPath test\app
          if (-not (Test-Path test\app\modules\coders\IM_MOD_RL_dpx_.dll)) { "::error::ImageMagick coders missing from the zip"; exit 1 }
          $env:APPDATA = "$PWD\test\roaming"; $env:LOCALAPPDATA = "$PWD\test\local"; $env:EYECANSEE_LOG = "1"
          $p = Start-Process -FilePath test\app\eyecansee.exe -ArgumentList $env:USERPROFILE -RedirectStandardError test\log.txt -PassThru
          Start-Sleep 8
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id }
          Get-Content test\log.txt
          if (-not $alive) { "::error::eyecansee.exe exited within 8 s"; exit 1 }
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=$env:VER" "/DPkg=$PWD\pkg" "/O$PWD" tools\eyecansee.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installer test
        run: |
          # Silent install for the current user, then uninstall: the exe and the "Open with" key must come and go.
          $setup = "EyeCanSee-$env:VER-windows-x64-setup.exe"
          $dir = "$env:LOCALAPPDATA\Programs\EyeCanSee"
          $key = "HKCU:\Software\Classes\EyeCanSee.Image"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /CURRENTUSER /NORESTART"
          if (-not (Test-Path "$dir\eyecansee.exe")) { "::error::eyecansee.exe not installed in $dir"; exit 1 }
          if (-not (Test-Path $key)) { "::error::$key not created"; exit 1 }
          if (-not (Test-Path "$dir\modules\coders\IM_MOD_RL_dpx_.dll")) { "::error::ImageMagick coders not installed"; exit 1 }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"
          # The uninstaller restarts itself from a temporary copy, so -Wait can return before it is done.
          foreach ($i in 1..30) { if (-not (Test-Path "$dir\eyecansee.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$dir\eyecansee.exe") { "::error::eyecansee.exe still there after uninstalling"; exit 1 }
          if (Test-Path $key) { "::error::$key still there after uninstalling"; exit 1 }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: |
            EyeCanSee-*-windows-x64.zip
            EyeCanSee-*-windows-x64-setup.exe

  appimage:
    permissions:
      contents: read
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Only the C libraries compiled from source (decoders, ImageMagick): the key is their versions in
      # the script, so other changes to it keep the cache.
      - id: deps
        run: echo "key=$(grep -E '^(DE265|IM)=' tools/build-appimage.sh | tr -s '= \n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/appimage-cache/deps-*
            ${{ runner.temp }}/appimage-cache/imagemagick-*
          key: appimage-deps-${{ steps.deps.outputs.key }}
      - name: Build
        env:
          APPIMAGE_CACHE: ${{ runner.temp }}/appimage-cache
        run: |
          mkdir -p "$APPIMAGE_CACHE"
          tools/build-appimage.sh
      - name: Check
        run: |
          A=$(ls target/appimage/EyeCanSee-*-x86_64.AppImage)
          cd target/appimage && "./$(basename "$A")" --appimage-extract >/dev/null
          for lib in libdav1d.so libde265.so libMagickCore libMagickWand; do
            ls squashfs-root/usr/lib | grep -q "^$lib" || { echo "::error::$lib missing"; exit 1; }
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: appimage
          path: target/appimage/EyeCanSee-*-x86_64.AppImage

  copr:
    permissions:
      contents: read
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - run: dnf install -y -q git rpm-build copr-cli
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Source RPM, sent to COPR for real releases
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          git config --global --add safe.directory "$PWD"
          if [[ "${{ needs.version.outputs.trial }}" == true ]]; then
            tools/copr-build.sh --srpm-only
          else
            mkdir -p ~/.config && printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
            tools/copr-build.sh
          fi

  release:
    permissions:
      contents: write
    needs: [version, windows, appimage, copr]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Draft built by GitHub Actions: release notes to be added."
            echo
            for f in EyeCanSee-*; do echo "SHA-256 of $f: \`$(sha256sum "$f" | cut -d' ' -f1)\`"; echo; done
          } > notes.md
          PRE=$([[ "${{ needs.version.outputs.trial }}" == true ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" EyeCanSee-* --repo "$GITHUB_REPOSITORY" --draft $PRE \
            --verify-tag --title "EyeCanSee ${{ needs.version.outputs.version }}" --notes-file notes.md
