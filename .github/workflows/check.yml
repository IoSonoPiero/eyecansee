# Clippy (with a limit of 80 lines per function, clippy.toml) and the tests at every push and pull
# request on main, with the same C libraries as the AppImage (tools/build-appimage.sh --check), plus a
# warning for files over 800 lines; the same on Windows, with the libraries of the Windows release
# (the code under #[cfg(windows)] is compiled only there). rustfmt is not used: the code does not
# follow its style.
name: check

# A commit that changes only the README is not checked: nothing built comes from it.
on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    branches: [main]
    paths-ignore: [README.md]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Only a warning, never a failure.
      - name: File sizes
        run: tools/check-sizes.sh
      # The decoders and ImageMagick compiled by release.yml (same key): on main and its pull
      # requests that cache is readable, so they are not compiled again.
      - id: deps
        run: echo "key=$(grep -E '^(DE265|IM)=' tools/build-appimage.sh | tr -s '= \n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/appimage-cache/deps-*
            ${{ runner.temp }}/appimage-cache/imagemagick-*
          key: appimage-deps-${{ steps.deps.outputs.key }}
      - name: Clippy and tests
        env:
          APPIMAGE_CACHE: ${{ runner.temp }}/appimage-cache
        run: |
          mkdir -p "$APPIMAGE_CACHE"
          tools/build-appimage.sh --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The same as the release (and its vcpkg cache, readable from main and its pull requests).
      - uses: ./.github/actions/windows-deps
      - name: Clippy
        run: cargo clippy --locked --all-targets --no-default-features --features heif,magick -- -D warnings
      # The tests find the ImageMagick DLLs on the PATH, its coders through the registry the
      # installer wrote; the configuration goes to a temporary folder.
      # Also when Clippy fails: a lint should not hide a failing test.
      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          $env:Path = "$env:IMAGE_MAGICK_DIR;$env:Path"
          $env:APPDATA = "$env:RUNNER_TEMP\roaming"; $env:LOCALAPPDATA = "$env:RUNNER_TEMP\local"
          cargo test --locked --no-default-features --features heif,magick

  # Known vulnerabilities and licences of the crates (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses
